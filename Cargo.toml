[package]
name = "filtrotui"
version = "0.5.0"
edition = "2021"
description = "TUI for KZD-3A filter test rig control"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
anyhow = "1"
serialport = { version = "4", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "5"

[profile.release]
opt-level = 3
lto = true
